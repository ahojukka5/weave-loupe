name: Weave audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.weave"
      - "src/weave_loupe/**"
      - "scripts/audit_pr.py"
      - "scripts/reaudit_stale.py"
      - ".github/workflows/weave-audit.yml"
      - ".github/workflows/scheduled-reaudit.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weave-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      WEAVE_LLM_ENDPOINT: ${{ secrets.WEAVE_LLM_ENDPOINT || vars.WEAVE_LLM_ENDPOINT }}
      WEAVE_LLM_API_KEY: ${{ secrets.WEAVE_LLM_API_KEY || secrets.WEAVE_LLM_API_TOKEN }}
      WEAVE_LLM_MODEL: ${{ vars.WEAVE_LLM_MODEL || 'z-ai/glm-5.2' }}

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.WEAVE_GITHUB_TOKEN }}

      - name: Detect generated-report commit
        id: guard
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "docs(audit): update generated reports" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out weavec
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ahojukka5/weavec
          path: .weave-tools/weavec
          fetch-depth: 0

      - name: Install LLVM toolchain
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld

      - name: Build weavec
        if: steps.guard.outputs.skip != 'true'
        working-directory: .weave-tools/weavec
        run: ./build.sh

      - name: Install uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        run: uv python install 3.12

      - name: Install weave-loupe
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --group dev

      - name: Run audits
        if: steps.guard.outputs.skip != 'true'
        id: audit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          head_sha="$(git rev-parse HEAD)"
          uv run python scripts/audit_pr.py \
            --base "$BASE_SHA" \
            --head "$head_sha" \
            --weavec "$GITHUB_WORKSPACE/.weave-tools/weavec/build/weavec" \
            --model "$WEAVE_LLM_MODEL" \
            --summary build/weave-audit-summary.md \
            --reports-list build/weave-audit-reports.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create infrastructure-failure summary
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ ! -f build/weave-audit-summary.md ]]; then
            mkdir -p build
            cat > build/weave-audit-summary.md <<EOF
          <!-- weave-loupe-pr-audit -->
          ## Weave Loupe audit

          **Overall:** ❌ FAILED

          The audit infrastructure failed before an LLM report could be produced.
          Inspect the failed GitHub Actions step and job log for the exact cause.
          EOF
          fi

      - name: Upload audit evidence
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weave-loupe-audit-${{ github.event.pull_request.number }}
          path: |
            build/weave-audit-summary.md
            build/weave-audit-reports.txt
            **/*.md
          if-no-files-found: warn

      - name: Comment on pull request
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- weave-loupe-pr-audit -->';
            let body = fs.readFileSync('build/weave-audit-summary.md', 'utf8');
            const limit = 60000;
            if (body.length > limit) {
              body = body.slice(0, limit) +
                '\n\n_Report truncated; download the workflow artifact for the complete audit._\n';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              comment => comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Commit passing reports
        if: steps.guard.outputs.skip != 'true' && steps.audit.outputs.exit_code == '0'
        shell: bash
        run: |
          while IFS= read -r report; do
            [[ -n "$report" ]] && git add -- "$report"
          done < build/weave-audit-reports.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(audit): update generated reports"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Enforce audit gate
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          test "${{ steps.audit.outputs.exit_code }}" = "0"
