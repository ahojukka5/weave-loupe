name: Weave audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.weave"
      - "**/*.audit.json"
      - "**/*.audit.sources"
      - "**/*.audit.failure.toml"
      - "docs/audit/**/*.md"
      - "docs/negative-audit/**/*.md"
      - "src/weave_loupe/**"
      - "scripts/audit_pr.py"
      - "scripts/reaudit_stale.py"
      - "scripts/check_workflow_security.py"
      - ".github/workflows/*.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: weave-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      WEAVE_LLM_ENDPOINT: ${{ secrets.WEAVE_LLM_ENDPOINT || vars.WEAVE_LLM_ENDPOINT }}
      WEAVE_LLM_API_KEY: ${{ secrets.WEAVE_LLM_API_KEY || secrets.WEAVE_LLM_API_TOKEN }}
      WEAVE_LLM_MODEL: ${{ vars.WEAVE_LLM_MODEL || 'z-ai/glm-5.2' }}
      WEAVE_LLM_MAX_TOKENS: ${{ vars.WEAVE_LLM_MAX_TOKENS || '4096' }}
      WEAVE_LLM_MAX_ATTEMPTS: ${{ vars.WEAVE_LLM_MAX_ATTEMPTS || '20' }}

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect audit scope
        id: guard
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          required=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              *.weave|*.audit.json|*.audit.sources|*.audit.failure.toml)
                if [[ -f "$path" ]]; then
                  required=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRD "$BASE_SHA" HEAD)

          if [[ "$required" == true ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=changed audit input" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no audit input changed" >> "$GITHUB_OUTPUT"
            {
              echo "## Weave audit"
              echo
              echo "No audit input changed. Run the manual re-audit workflow when"
              echo "you want to refresh historical corpus reports."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out weavec
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ahojukka5/weavec
          path: .weave-tools/weavec
          fetch-depth: 0
          persist-credentials: false

      - name: Install LLVM toolchain and runtime sandbox
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: Build weavec
        if: steps.guard.outputs.skip != 'true'
        working-directory: .weave-tools/weavec
        run: ./build.sh

      - name: Install uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        run: uv python install 3.12

      - name: Install weave-loupe
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --group dev

      - name: Run changed audits
        if: steps.guard.outputs.skip != 'true'
        id: audit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          head_sha="$(git rev-parse HEAD)"
          uv run python scripts/audit_pr.py \
            --base "$BASE_SHA" \
            --head "$head_sha" \
            --weavec "$GITHUB_WORKSPACE/.weave-tools/weavec/build/weavec" \
            --model "$WEAVE_LLM_MODEL" \
            --max-tokens "$WEAVE_LLM_MAX_TOKENS" \
            --summary build/weave-audit-summary.md \
            --reports-list build/weave-audit-reports.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify generated report identities
        if: steps.guard.outputs.skip != 'true' && steps.audit.outputs.exit_code == '0'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/report-validity
          count=0
          while IFS= read -r report; do
            [[ -n "$report" ]] || continue
            count=$((count + 1))
            name="${report//\//__}"
            uv run loupe verify-report "$report" \
              --weavec "$GITHUB_WORKSPACE/.weave-tools/weavec/build/weavec" \
              --model "$WEAVE_LLM_MODEL" \
              --llm-endpoint "$WEAVE_LLM_ENDPOINT" \
              --max-tokens "$WEAVE_LLM_MAX_TOKENS" \
              --json-out "build/report-validity/${name%.md}.json"
          done < build/weave-audit-reports.txt
          test "$count" -gt 0

      - name: Create infrastructure-failure summary
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ ! -f build/weave-audit-summary.md ]]; then
            mkdir -p build
            cat > build/weave-audit-summary.md <<'EOF'
          <!-- weave-loupe-pr-audit -->
          ## Weave Loupe audit

          **Overall:** ⚠️ ADVISORY AUDIT UNAVAILABLE

          The model-backed audit could not produce a report. This is advisory
          evidence and does not gate the pull request; inspect the job log if the
          audit result matters for this change.
          EOF
          fi

      - name: Stage immutable publication artifact
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          root=build/publication
          mkdir -p "$root"
          cp build/weave-audit-summary.md "$root/weave-audit-summary.md"
          if [[ -f build/weave-audit-reports.txt ]]; then
            cp build/weave-audit-reports.txt "$root/weave-audit-reports.txt"
          else
            : > "$root/weave-audit-reports.txt"
          fi
          if [[ -d build/report-validity ]]; then
            cp -R build/report-validity "$root/report-validity"
          fi

          while IFS= read -r report; do
            [[ -n "$report" ]] || continue
            case "$report" in
              docs/audit/*.md|docs/negative-audit/*.md) ;;
              *) echo "::warning::Unsafe report path ignored: $report"; continue ;;
            esac
            [[ "$report" != *".."* ]] || continue
            [[ -f "$report" && ! -L "$report" ]] || continue
            mkdir -p "$root/$(dirname "$report")"
            cp -- "$report" "$root/$report"
          done < "$root/weave-audit-reports.txt"

          (
            cd "$root"
            find . -type f ! -name MANIFEST.sha256 -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > MANIFEST.sha256
          )

      - name: Upload audit evidence
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weave-loupe-audit-${{ github.event.pull_request.number }}
          path: build/publication
          if-no-files-found: warn
          retention-days: 30

      - name: Report advisory audit outcome
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          code="${{ steps.audit.outputs.exit_code }}"
          if [[ -n "$code" && "$code" != "0" ]]; then
            echo "::warning::Model-backed audit exited with code $code; PR correctness CI remains authoritative."
          fi
          exit 0
