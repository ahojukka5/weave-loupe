name: mypy-debug

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --all-groups --frozen
      - name: Capture Mypy output
        shell: bash
        run: |
          set +e
          uv run mypy > mypy.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: mypy-debug-current
          path: mypy.txt
          if-no-files-found: error
          retention-days: 1
