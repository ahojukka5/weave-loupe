name: export-native-evidence-source

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'tmp/native-evidence-source-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=.venv -czf /tmp/weave-loupe-master.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: weave-loupe-master-source
          path: /tmp/weave-loupe-master.tar.gz
          if-no-files-found: error
          retention-days: 1
