name: format-audit-gate

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'tmp/format-audit-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Fix and format product branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/reproducible-audit-gate
          git checkout -B feature/reproducible-audit-gate origin/feature/reproducible-audit-gate
          python - <<'PY'
          from pathlib import Path

          path = Path("src/weave_loupe/audit_result.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import subprocess\n", "import subprocess\nimport sys\n", 1)
          text = text.replace('"byteorder": os.sys.byteorder,', '"byteorder": sys.byteorder,')
          path.write_text(text, encoding="utf-8")
          PY
          uv sync --group dev
          uv run ruff check --fix .
          uv run ruff format .
          uv run mypy
          git status --short
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(audit): report Python byte order portably"
          git pull --rebase origin feature/reproducible-audit-gate
          git push origin HEAD:feature/reproducible-audit-gate
