name: Research regression qualification

on:
  push:
    branches:
      - research/compiler-evidence-protocol
    paths:
      - ".github/workflows/regression-evidence-qualification.yml"
      - "scripts/regression_evidence_protocol.py"
      - "scripts/regression_evidence_qualify.py"
      - "experiments/compiler-evidence/corpus.json"
      - "experiments/compiler-evidence/oracles/**"
      - "tests/test_regression_evidence_qualify.py"
  pull_request:
    paths:
      - ".github/workflows/regression-evidence-qualification.yml"
      - "scripts/regression_evidence_protocol.py"
      - "scripts/regression_evidence_qualify.py"
      - "experiments/compiler-evidence/corpus.json"
      - "experiments/compiler-evidence/oracles/**"
      - "tests/test_regression_evidence_qualify.py"

permissions:
  contents: read

concurrency:
  group: regression-evidence-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: "generate: historical regression qualification"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Loupe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out complete weavec history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ahojukka5/weavec
          path: _weavec
          fetch-depth: 0
          persist-credentials: false

      - name: Install matched LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version
          llc --version

      - name: Validate draft historical corpus
        run: |
          python3 scripts/regression_evidence_protocol.py validate-corpus \
            experiments/compiler-evidence/corpus.json

      - name: Qualify historical bad/good pairs
        run: |
          python3 scripts/regression_evidence_qualify.py \
            experiments/compiler-evidence/corpus.json \
            --weavec-repo _weavec \
            --oracle-root . \
            --output build/regression-evidence/qualification.json

      - name: Show qualification result
        if: always()
        run: |
          if test -f build/regression-evidence/qualification.json; then
            cat build/regression-evidence/qualification.json
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-evidence-qualification
          path: build/regression-evidence/qualification.json
          if-no-files-found: warn
