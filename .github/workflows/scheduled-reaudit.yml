name: Manual Weave re-audit

# Corpus-wide LLM re-audits are explicit evidence generation while the project
# is pre-1.0. They do not auto-commit reports or file cross-repository issues.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-audit every canonical positive and negative case
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-weave-reaudit
  cancel-in-progress: false

jobs:
  re-audit:
    name: Generate audit evidence
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      WEAVE_LLM_ENDPOINT: ${{ secrets.WEAVE_LLM_ENDPOINT || vars.WEAVE_LLM_ENDPOINT }}
      WEAVE_LLM_API_KEY: ${{ secrets.WEAVE_LLM_API_KEY || secrets.WEAVE_LLM_API_TOKEN }}
      WEAVE_LLM_MODEL: ${{ vars.WEAVE_LLM_MODEL || 'z-ai/glm-5.2' }}
      WEAVE_LLM_MAX_TOKENS: ${{ vars.WEAVE_LLM_MAX_TOKENS || '4096' }}
      WEAVE_LLM_MAX_ATTEMPTS: ${{ vars.WEAVE_LLM_MAX_ATTEMPTS || '20' }}

    steps:
      - name: Check out Weave Loupe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current weavec
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ahojukka5/weavec
          ref: master
          path: .weave-tools/weavec
          fetch-depth: 0
          persist-credentials: false

      - name: Install LLVM toolchain and runtime sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: Build current weavec
        working-directory: .weave-tools/weavec
        run: ./build.sh

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Python and Loupe
        run: |
          uv python install 3.12
          uv sync --group dev

      - name: Find and refresh due reports
        id: audit
        shell: bash
        run: |
          set +e
          force=()
          if [[ "${{ inputs.force }}" == "true" ]]; then
            force=(--force)
          fi
          uv run python scripts/reaudit_stale.py \
            --weavec "$GITHUB_WORKSPACE/.weave-tools/weavec/build/weavec" \
            --model "$WEAVE_LLM_MODEL" \
            --llm-endpoint "$WEAVE_LLM_ENDPOINT" \
            --max-tokens "$WEAVE_LLM_MAX_TOKENS" \
            --max-age-days 30 \
            --summary build/manual-audit/summary.md \
            --reports-list build/manual-audit/reports.txt \
            --failures-json build/manual-audit/failures.json \
            --logs-dir build/manual-audit/logs \
            "${force[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stage immutable audit artifact
        if: always()
        shell: bash
        run: |
          source_root=build/manual-audit
          root=build/manual-publication
          mkdir -p "$source_root" "$root"
          [[ -f "$source_root/summary.md" ]] || \
            printf '# Manual audit\n\nAudit infrastructure failed.\n' \
              > "$source_root/summary.md"
          [[ -f "$source_root/reports.txt" ]] || : > "$source_root/reports.txt"
          [[ -f "$source_root/failures.json" ]] || \
            printf '{"compiler_findings":[]}\n' > "$source_root/failures.json"

          cp "$source_root/summary.md" "$root/summary.md"
          cp "$source_root/reports.txt" "$root/reports.txt"
          cp "$source_root/failures.json" "$root/failures.json"
          if [[ -d "$source_root/logs" ]]; then
            cp -R "$source_root/logs" "$root/logs"
          fi

          while IFS= read -r report; do
            [[ -n "$report" ]] || continue
            case "$report" in
              docs/audit/*.md|docs/negative-audit/*.md) ;;
              *) echo "::warning::Unsafe report path ignored: $report"; continue ;;
            esac
            [[ "$report" != *".."* ]] || continue
            [[ -f "$report" && ! -L "$report" ]] || continue
            mkdir -p "$root/$(dirname "$report")"
            cp -- "$report" "$root/$report"
          done < "$root/reports.txt"

          (
            cd "$root"
            find . -type f ! -name MANIFEST.sha256 -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > MANIFEST.sha256
          )

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-weave-audit-${{ github.run_id }}
          path: build/manual-publication
          if-no-files-found: error
          retention-days: 30

      - name: Report audit outcome
        if: always()
        shell: bash
        run: |
          code="${{ steps.audit.outputs.exit_code }}"
          if [[ -n "$code" && "$code" != "0" ]]; then
            echo "::warning::Manual model-backed audit exited with code $code. Review the artifact for details."
          fi
          exit 0
