name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run ruff check . 2>&1 | tee build/quality/ruff-check.log

      - name: Ruff format
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee build/quality/ruff-format.log

      - name: Mypy
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run mypy 2>&1 | tee build/quality/mypy.log

      - name: Pytest
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run pytest 2>&1 | tee build/quality/pytest.log

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: build/quality
          if-no-files-found: warn
          retention-days: 7
