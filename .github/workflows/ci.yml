name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Workflow security policy
        run: uv run python scripts/check_workflow_security.py

      - name: Ruff check
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run ruff check . 2>&1 | tee build/quality/ruff-check.log

      - name: Ruff format
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee build/quality/ruff-format.log

      - name: Mypy
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run mypy 2>&1 | tee build/quality/mypy.log

      - name: Pytest
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run pytest 2>&1 | tee build/quality/pytest.log

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: build/quality
          if-no-files-found: warn
          retention-days: 7
