name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  guard-self-hosted:
    name: Verify trusted source for self-hosted jobs
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Self-hosted jobs do not run for pull requests from forks (head repository: ${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

  quality:
    needs: guard-self-hosted
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Runtime unit fixtures explicitly select their local direct test mode.
      # The namespace-isolation integration test skips when its backend is absent.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run ruff check . 2>&1 | tee build/quality/ruff-check.log

      - name: Ruff format
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee build/quality/ruff-format.log

      - name: Mypy
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run mypy 2>&1 | tee build/quality/mypy.log

      - name: Pytest
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          uv run pytest 2>&1 | tee build/quality/pytest.log

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: build/quality
          if-no-files-found: warn
          retention-days: 7
