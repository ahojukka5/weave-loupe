[project]
name = "weave-loupe"
version = "0.1.0"
description = "Tools to help in Weave compiler development"
readme = "README.md"
authors = [
    { name = "Jukka Aho", email = "ahojukka5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
loupe = "weave_loupe.cli:main"
loupe-corpus = "weave_loupe.scheduled_audit:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# The accumulator owns the spool across selector callbacks and closes it in finish().
"src/weave_loupe/bounded_process.py" = ["SIM115"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["weave_loupe"]
mypy_path = "src"
